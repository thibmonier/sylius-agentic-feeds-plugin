imports:
    - { resource: "@TmonierSyliusAgenticFeedsPlugin/config/config.yaml" }
    - { resource: "@TmonierSyliusWebhookOutboxPlugin/config/config.yaml" }
    - { resource: "dbal_savepoints.php" }

tmonier_sylius_agentic_feeds:
    # The demo catalog has no brand attribute.
    default_brand: 'Sylius Demo'
    storage:
        directory: '%kernel.project_dir%/../../../var/agentic_feeds/%kernel.environment%'
    seller_policies:
        FASHION_WEB:
            return_policy: 'https://example.com/returns'
            return_days: 30

# Demo feeds of every channel (dev and test databases).
sylius_fixtures:
    suites:
        default:
            fixtures:
                tmonier_agentic_feeds:
                    priority: -100
