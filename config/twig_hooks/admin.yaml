sylius_twig_hooks:
    hooks:
        'tmonier_agentic_feeds_admin.product_feed.create.content.form.sections.general':
            default:
                enabled: false
            fields:
                template: '@TmonierSyliusAgenticFeedsPlugin/admin/product_feed/form/fields.html.twig'
                priority: 0

        'tmonier_agentic_feeds_admin.product_feed.update.content.form.sections.general':
            default:
                enabled: false
            fields:
                template: '@TmonierSyliusAgenticFeedsPlugin/admin/product_feed/form/fields.html.twig'
                priority: 0

        # Breadcrumb of the edit page: the name, not the id.
        'tmonier_agentic_feeds_admin.product_feed.update.content.header':
            breadcrumbs:
                template: '@SyliusAdmin/shared/crud/update/content/header/breadcrumbs.html.twig'
                configuration:
                    rendered_field: name
                priority: 100

        # GTIN / MPN of variants (feeds).
        'sylius_admin.product_variant.create.content.form.sections.general.body':
            tmonier_agentic_feeds_identifiers:
                template: '@TmonierSyliusAgenticFeedsPlugin/admin/identifiers/variant.html.twig'
                priority: -100

        'sylius_admin.product.create.content.form.sections.general':
            tmonier_agentic_feeds_identifiers:
                template: '@TmonierSyliusAgenticFeedsPlugin/admin/identifiers/product.html.twig'
                priority: -100

        # GTIN / MPN of variants (feeds).
        'sylius_admin.product_variant.update.content.form.sections.general.body':
            tmonier_agentic_feeds_identifiers:
                template: '@TmonierSyliusAgenticFeedsPlugin/admin/identifiers/variant.html.twig'
                priority: -100

        'sylius_admin.product.update.content.form.sections.general':
            tmonier_agentic_feeds_identifiers:
                template: '@TmonierSyliusAgenticFeedsPlugin/admin/identifiers/product.html.twig'
                priority: -100
